<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
   <style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
   
}


/* ================= LIGHT THEME ================= */

body.light {
    background-color: #f4f4f4;
    color: black;
}

body.light #container {
    background-color: #eff6ff;
    color: #1e293b;
}

body.light h1 {
    color: #1e293b;
}

body.light label {
    color: #334155;
}

body.light input,
body.light textarea {
    background-color: #ffffff;
    color: #1e293b;
    border-color: #94a3b8;
}


/* ================= DARK THEME ================= */

body.dark {
    background-color: #222;
    color: white;
}

body.dark #container {
    background-color: #334155;
    color: #f8fafc;
}

body.dark h1 {
    color: #f8fafc;
}

body.dark label {
    color: #e2e8f0;
}

body.dark input,
body.dark textarea {
    background-color: #475569;
    color: #ffffff;
    border-color: #64748b;
}

body.dark input::placeholder,
body.dark textarea::placeholder {
    color: #cbd5e1;
}


/* ================= NAVBAR ================= */

.navbar {
    width: 100%;
    background-color: #1f2937;
    padding: 15px 30px;
    display: flex;
    align-items: center;
     border-radius: 8px;
    margin-bottom: 40px;
}



.logo {
    color: white;
    font-size: 20px;
    font-weight: bold;
}

.theme-buttons {
    display: flex;
    gap: 6px;
    margin-left: auto;
    margin-right: 20px;
}

.theme-buttons a {
    text-decoration: none;
    color: white;
    padding: 7px 12px;
    border: 1px solid #00a6c7;
    border-radius: 5px;
    font-size: 13px;
}

.theme-buttons a:hover {
    background-color: #00a6c7;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 8px;
}

.nav-links li a {
    text-decoration: none;
    color: white;
    padding: 9px 13px;
    border-radius: 5px;
    font-size: 14px;
}

.nav-links li a:hover {
    background-color: #00a6c7;
}


/* ================= EDIT FORM ================= */

#container {
    width: 500px;
    margin: 0 auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    transition: 0.3s;
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 24px;
}


/* ================= FORM ================= */

form > div {
    margin-bottom: 16px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

input,
textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid;
    border-radius: 5px;
    font-size: 14px;
    outline: none;
    font-family: Arial, sans-serif;
}

input:focus,
textarea:focus {
    border-color: #00a6c7;
}

textarea {
    min-height: 90px;
    resize: vertical;
}


/* ================= BUTTONS ================= */

.button {
    display: flex;
    gap: 10px;
    margin-top: 22px;
}

button {
    padding: 10px 22px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.update-btn {
    background-color: #00a6c7;
    color: white;
}

.reset-btn {
    background-color: #555;
    color: white;
}

.update-btn:hover {
    background-color: #008ba3;
}

.reset-btn:hover {
    background-color: #333;
}

    </style>
</head>
<body class="{{theme}}">
    <nav class="navbar">
        <div class="logo">
           Employee Management System
        </div>
        <div class="theme-buttons">
            <a href="/set-theme/light">☀️Light</a>
            <a href="/set-theme/dark">🌙Dark</a>
        </div>
        <ul class="nav-links">
            <li>
                <a href="/">Home</a>
            </li>
            <li>
                <a href="/employees">Employees</a>
            </li>
            <li>
                <a href="/add-employee">Addemployee</a>
            </li>
            <li>
                <a href="/search">Search</a>
            </li>
        </ul>
    </nav>
     <div id="container">
         <h1>Edit Employee</h1>
      
   
    <form action="/edit-employee/{{ employee['id'] }}" method="POST">
       <div>
          <label>Name:</label>
          <input type="text" name="name" value="{{ employee['name'] }}" required>
       </div>
       <div>
        <label>Email:</label>
        <input type="email" name="email" value="{{ employee['email'] }}" required>
        </div>
         <div>
        <label>Phone:</label>
        <input type="tel" name="phone" value="{{ employee['phone'] }}" required>
        </div>
         <div>
        <label>Department:</label>
        <input type="text" name="department" value="{{ employee['department'] }}" required>
       </div>
         <div>
        <label>Salary:</label>
        <input type="number" name="salary" value="{{ employee['salary'] }}" required>
        </div>
      <div>
        <label>Joining Date:</label>
        <input type="date" name="joiningdate" value="{{ employee['joiningdate'] }}" required>
       </div>
       <div>
            <label>Address:</label>
            <textarea name="address" required >{{ employee['address'] }}</textarea>
        </div>

        <div class="button">

        <button type="submit" class="update-btn">
            Updateemployee
        </button>

        <button type="reset" class="reset-btn">
            Reset
        </button>

        </div>

    </form>

</body>
</html>
