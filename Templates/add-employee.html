<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
   
}

/* ================= LIGHT THEME ================= */

body.light {
    background-color: #f4f4f4;
    color: black;
}

body.light .container {
    background-color: #eff6ff;
    color: #1e293b;
}

body.light h2 {
    color: #1e293b;
}

body.light label {
    color: #334155;
}

body.light input,
body.light select,
body.light textarea {
    background-color: #ffffff;
    color: #1e293b;
    border-color: #94a3b8;
}


/* ================= DARK THEME ================= */

body.dark {
    background-color: #222;
    color: white;
}

body.dark .container {
    background-color: #334155;
    color: #f8fafc;
}

body.dark h2 {
    color: #f8fafc;
}

body.dark label {
    color: #e2e8f0;
}

body.dark input,
body.dark select,
body.dark textarea {
    background-color: #475569;
    color: #ffffff;
    border-color: #64748b;
}

body.dark input::placeholder,
body.dark textarea::placeholder {
    color: #cbd5e1;
}


/* ================= NAVBAR ================= */

.navbar {
   
    display: flex;
    align-items: center;
   padding: 15px 30px;
    background-color: #222;
    border-radius: 8px;
    margin-bottom: 40px;
}



.logo {
    color: white;
    font-size: 24px;
    font-weight: bold;
}

.theme-buttons {
    display: flex;
    gap: 10px;
    margin-left: 30px;
}

.theme-buttons a {
    text-decoration: none;
    color: white;
    padding: 8px 12px;
    border: 1px solid #00a6c7;
    border-radius: 5px;
    font-size: 16px;
}

.theme-buttons a:hover {
    background-color: #00a6c7;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
    margin-left: auto;
}

.nav-links li a {
    text-decoration: none;
    color: white;
    padding: 8px 12px;
    border-radius: 5px;
    font-size: 16px;
}

.nav-links li a:hover {
    background-color: #00a6c7;
}


/* ================= ADD EMPLOYEE BOX ================= */

.container {
    width: 500px;
    margin: 0 auto;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
    transition: 0.3s;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}


/* ================= FORM ================= */

.row {
    margin-bottom: 16px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

label {
    margin-bottom: 7px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid;
    border-radius: 5px;
    font-size: 14px;
    outline: none;
    font-family: Arial, sans-serif;
}

input:focus,select:focus,textarea:focus {
    border-color: #00a6c7;
}

textarea {
    resize: vertical;
}


/* ================= BUTTONS ================= */

.button {
    display: flex;
    gap: 10px;
    margin-top: 22px;
}

button {
    padding: 10px 22px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.add-btn {
    background-color: #00a6c7;
    color: white;
}

.reset-btn {
    background-color: #555;
    color: white;
}

.add-btn:hover {
    background-color: #008ba3;
}

.reset-btn:hover {
    background-color: #333;
}

    
</style>
</head>
<body class="{{ theme }}">
   <nav class="navbar">
       <div class="logo">
           Employee Management System
       </div>
        <div class="theme-buttons">
                <a href="/set-theme/light">☀️Light</a>
                <a href="/set-theme/dark">🌙Dark</a>
        </div>
        <ul class="nav-links">
            <li>
                <a href="/">Home</a>
            </li>
            <li>
                <a href="/employees">Employees</a>
            </li>
            <li>
                <a href="/add-employee">Addemployee</a>
            </li>
            <li>
                <a href="/search">Search</a>
            </li>
        </ul>
    </nav>
    <div class="container" >
         <h2>Add employee</h2>
      <form action="/add-employee" method="POST">
            <div class="row">
            <div class="form-group">
            <label for="name">EmployeeName:</label>
            <input type="text" name="name" id="name" 
                placeholder="enter employeename" >
                </div>
                </div>
                <div class="row">
                <div class="form-group">
                <label for="email">Email:</label>
                <input type="email"name="email" id="email"
                placeholder="enter email" >
                </div>
                </div>
                <div class="row">
                <div class="form-group">
                <label for="phone">Phonenumber:</label>
            <input type="tel" name="phone" id="phone" placeholder="enter Phonenumber" >
                </div>
                </div>
                <div class="row">
                <div class="form-group">
            <label for="department">Department:</label>
            <select name="department" id="department">
                <option value="" >select department</option>
                <option value="IT">IT</option>
                <option value="sales">sales</option>
                <option value="HR">HR</option>
                <option value="finance">Finance</option>
                <option value="manager">Manager</option>
            </select>
            </div>
            </div>
            <div class="row">
            <div class="form-group">
            <label for="salary">Salary:</label>
            <input type="number" name="salary" id="salary"
                placeholder="enter salary" >
                </div>
                </div>
                <div class="row">
            <div class="form-group">
            <label for="joiningdate">Joiningdate:</label>
            <input type="date" name="joiningdate" id="joiningdate"
                placeholder="enter joiningdate" >
            </div>
            </div>
            <div class="row">
            <div class="form-group">
            <label for="address">Address:</label>
            <textarea name="address" id="address" rows="4"
            placeholder="enter address" ></textarea>
            </div>
            </div>
            <div class="button">
            <button type="submit" class="add-btn"> Addemployee</button>
            <button type="reset" class="reset-btn">Reset</button>
            </div>
      
        </form>
    </div>
</body>
</html>
